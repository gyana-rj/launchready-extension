<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LaunchReady</title>
  </head>
  <body>
    <main>
      <header>
        <h1>LaunchReady <span id="pro-badge" class="pro-badge" hidden>PRO</span></h1>
        <span id="usage" class="muted"></span>
      </header>

      <button id="scan" type="button">Scan this page</button>
      <p id="message" class="message" role="status" hidden></p>
      <button id="upgrade" class="secondary" type="button" hidden>Upgrade to Pro</button>

      <section id="results" hidden>
        <p id="page" class="muted"></p>
        <div class="summary">
          <div id="score" class="score" aria-label="Score"></div>
          <div id="counts" class="counts"></div>
        </div>
        <div class="actions">
          <button id="report" class="secondary" type="button">Open full report</button>
          <button id="export" class="secondary" type="button">Export CSV</button>
        </div>
        <div id="issues"></div>
      </section>
      <footer>
        <button id="link-history" class="link" type="button">History</button>
        <button id="link-bulk" class="link" type="button">Bulk scan</button>
        <button id="link-settings" class="link" type="button">Settings</button>
      </footer>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
